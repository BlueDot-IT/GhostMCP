name: Codex Security daily scan

on:
  schedule:
    - cron: "21 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codex-security-daily
  cancel-in-progress: true

jobs:
  codex-security:
    name: Codex Security
    permissions:
      actions: read
      contents: read
    uses: BlueDot-IT/odinn-maintainer/.github/workflows/codex-security-daily.yml@fda7834c49315dee2674aa36a0d5d048c326767e # reusable-v2
    with:
      target_repository: ${{ github.repository }}
      target_ref: ${{ github.event.repository.default_branch }}
    secrets:
      ODINN_OPENAI_OAUTH_JSON: ${{ secrets.ODINN_OPENAI_OAUTH_JSON }}
      ODINN_SECURITY_ARTIFACT_KEY: ${{ secrets.ODINN_SECURITY_ARTIFACT_KEY }}
