name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  verify-tag:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify release tag and protected-main ancestry
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

  release:
    needs: verify-tag
    permissions:
      contents: write
      id-token: write
      attestations: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: python -m pip install --require-hashes -r requirements-release.lock.txt

      - name: Build release artifacts
        run: python -m build --no-isolation

      - name: Verify artifacts
        run: twine check dist/*

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.spdx.json

      - name: Upload Python distributions for optional PyPI publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.spdx.json


  publish-pypi:
    if: github.repository == 'BlueDot-IT/GhostMCP' && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ghostmcp-server
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions-${{ github.ref_name }}
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          print-hash: true
